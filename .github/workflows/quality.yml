
name: Quality

on:
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Code quality and tests
    runs-on: ubuntu-latest

    steps:
      # 1. Haal de repository op
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installeer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Installeer dependencies
      - name: Install dependencies
        run: npm install

      # 4. Controleer codekwaliteit met ESLint
      - name: Run ESLint
        run: npm run lint

      # 5. Voer unittests uit en genereer JUnit rapport
      - name: Run tests
        run: npm test -- --reporters=default --reporters=jest-junit

      # 6. Toon testresultaten in GitHub Actions
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Test Results
          path: junit.xml
          reporter: java-junit

